<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مغزدانه | گالری تخصصی مغز پسته، بادام و گردوی دست‌اول</title>
  <meta name="description" content="مغزدانه — از پوستهٔ بسته، تا جوهرِ سبز. گالری تخصصی مغز پسته اکبری، خلال سبز، بادام و گردوی دست‌اول رفسنجان بدون واسطه.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css?v=10">
  <link rel="stylesheet" href="assets/css/fx.css?v=10">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="مغزدانه — از پوستهٔ بسته، تا جوهرِ سبز">
  <meta property="og:description" content="سفر سه‌بعدی پسته اکبری رفسنجان از پوسته بسته و پوست قرمز طبیعی تا مغز سبز خالص.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="src/assets/images/pistachio_kernel_pure_green_1795349498393.jpg">
  <meta property="og:locale" content="fa_IR">
  <meta name="theme-color" content="#060907">
</head>
<body class="home-page prologue-only">
  <!-- Minimal Floating Prologue Bar (No e-commerce clutter on the 3D entrance stage) -->
  <header class="prologue-top" aria-label="ناوبری ورودی">
    <a class="brand" href="index.html" aria-label="مغزدانه">
      <img src="assets/img/logo.svg" alt="" width="30" height="30">
      <span class="brand-name" id="cms-brand-name">مغزدانه</span>
    </a>
    <div class="prologue-top-actions">
      <button type="button" class="prologue-play-btn" id="btn-autoplay" aria-pressed="false">
        <span class="play-icon" aria-hidden="true">▶</span>
        <span id="autoplay-label">پخش خودکار</span>
      </button>
      <a class="prologue-skip-link" id="top-enter-link" href="catalog.html">ورود به سایت ←</a>
    </div>
  </header>

  <!-- ================= PURE FULL-SCREEN 5-STAGE 3D PISTACHIO PROLOGUE ================= -->
  <main class="cinema-stage-wrap" id="cinema-wrap" aria-label="سفر ۵-مرحله‌ای پسته واقعی از بسته تا مغز سبز خالص">
    <div class="cinema-sticky">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>

      <div class="cinema-fallback-img" id="cinema-fallback" hidden>
        <img src="src/assets/images/pistachio_kernel_pure_green_1795349498393.jpg" alt="مغز پسته سبز خالص اکبری رفسنجان">
      </div>

      <div class="cinema-scrim" aria-hidden="true"></div>

      <div class="cinema-copy-shell">
        <div class="cinema-copy-col" id="cinema-copy">
          <span class="cinema-kicker" id="cms-kicker">۰۱ · برداشت ۱۴۰۵ رفسنجان</span>
          <h1 class="cinema-title" id="cms-title">از پوستهٔ بسته، تا جوهرِ سبز.</h1>
          <p class="cinema-sub" id="cms-sub">گزیدهٔ مستقیم باغ‌های رفسنجان و دامغان؛ هنوز در صدف چوبی طبیعت.</p>

          <!-- Quiet Scroll Prompt (Visible on Stages 01–04) -->
          <div class="prologue-cue" id="prologue-cue">
            <span class="cue-line" aria-hidden="true"></span>
            <span class="cue-text">برای باز شدن و پوست‌گیری پسته اسکرول کنید</span>
          </div>

          <!-- Finale Gateway CTA (Blooms into prominence on Stage 05: Pure Emerald Kernel) -->
          <div class="finale-gateway" id="finale-gateway" aria-hidden="true">
            <a class="lux-btn-enter" id="cms-cta-primary" href="catalog.html">
              <span id="cms-cta-primary-text">ورود به سایت مغزدانه</span>
              <span class="enter-arrow" aria-hidden="true">←</span>
            </a>
            <div class="finale-sub-links">
              <a class="lux-link-quiet" id="cms-cta-secondary" href="wholesale.html">خرید عمده و پلکانی</a>
              <span class="sub-dot" aria-hidden="true">·</span>
              <a class="lux-link-quiet" href="account.html">حساب کاربری</a>
              <span class="sub-dot" aria-hidden="true">·</span>
              <button type="button" class="lux-link-quiet" id="btn-replay">تماشای مجدد</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Whisper-Thin 5-Stop Horizontal Timeline Rail (GPU scaleX + Clickable Stops) -->
      <nav class="stage-rail" aria-label="پنج مرحله باز شدن و پوست‌گیری پسته">
        <div class="stage-rail-track" aria-hidden="true">
          <div class="stage-rail-fill" id="stage-rail-fill"></div>
        </div>
        <div class="stage-rail-stops" id="stage-rail-stops">
          <button type="button" class="stage-stop active" data-stage-idx="0"><span class="st-idx">۰۱</span><span>پسته بسته</span></button>
          <button type="button" class="stage-stop" data-stage-idx="1"><span class="st-idx">۰۲</span><span>خندانی طبیعی</span></button>
          <button type="button" class="stage-stop" data-stage-idx="2"><span class="st-idx">۰۳</span><span>جدایی پوسته</span></button>
          <button type="button" class="stage-stop" data-stage-idx="3"><span class="st-idx">۰۴</span><span>پوست‌گیری قرمز</span></button>
          <button type="button" class="stage-stop" data-stage-idx="4"><span class="st-idx">۰۵</span><span>مغز سبز خالص</span></button>
        </div>
      </nav>
    </div>
  </main>

  <script src="assets/js/firebase-bundle.js?v=10" defer></script>
  <script type="module">
    import { createPistachioCinemaStage } from './assets/js/cinema-stage.js?v=10';

    const DEFAULT_STAGES = [
      {
        index: '۰۱',
        label: 'پسته بسته',
        kicker: '۰۱ · برداشت ۱۴۰۵ رفسنجان',
        title: 'از پوستهٔ بسته، تا جوهرِ سبز.',
        subtitle: 'گزیدهٔ مستقیم باغ‌های رفسنجان و دامغان؛ هنوز در صدف چوبی طبیعت.',
      },
      {
        index: '۰۲',
        label: 'خندانی طبیعی',
        kicker: '۰۲ · خندانی طبیعی',
        title: 'پوسته باز می‌شود؛ مغز در پوست قرمز.',
        subtitle: 'خندانی دست‌چین بدون آب‌خندان — مغز درشت با پوشش کامل ارغوانی درون صدف.',
      },
      {
        index: '۰۳',
        label: 'جدایی پوسته',
        kicker: '۰۳ · مغزکنی کارگاهی',
        title: 'جدایی تمیز؛ مغز در لباس ارغوانی.',
        subtitle: 'پوستهٔ استخوانی با دقت کنار می‌رود و مغز یکدست با غشای قرمز طبیعی نمایان می‌ماند.',
      },
      {
        index: '۰۴',
        label: 'پوست‌گیری قرمز',
        kicker: '۰۴ · پوست‌گیری ظریف',
        title: 'پوست نازک قرمز، آرام کنده می‌شود.',
        subtitle: 'غشای کاغذی ارغوانی لایه‌به‌لایه جدا می‌شود تا رنگ زمردی اصیل زیر آن بدرخشد.',
      },
      {
        index: '۰۵',
        label: 'مغز سبز خالص',
        kicker: '۰۵ · جوهر زمردی خالص',
        title: 'مغز سبزِ ناب، آمادهٔ انتخاب شما.',
        subtitle: 'تازه‌سورت و دست‌اول — از ۲۵۰ گرم خانگی تا سفارش‌های عمده قنادی و صادراتی.',
      },
    ];

    let homeCms = {
      kicker: DEFAULT_STAGES[0].kicker,
      title: DEFAULT_STAGES[0].title,
      subtitle: DEFAULT_STAGES[0].subtitle,
      primaryCtaLabel: 'ورود به سایت مغزدانه',
      primaryCtaHref: 'catalog.html',
      secondaryCtaLabel: 'خرید عمده و پلکانی',
      secondaryCtaHref: 'wholesale.html',
      stages: DEFAULT_STAGES,
    };

    let activeStageIdx = 0;
    let stageEngine = null;
    let autoPlayRaf = 0;
    let autoPlaying = false;

    const copyCol = document.getElementById('cinema-copy');
    const kickerEl = document.getElementById('cms-kicker');
    const titleEl = document.getElementById('cms-title');
    const subEl = document.getElementById('cms-sub');
    const cueEl = document.getElementById('prologue-cue');
    const finaleEl = document.getElementById('finale-gateway');
    const railFill = document.getElementById('stage-rail-fill');
    const wrap = document.getElementById('cinema-wrap');
    const autoBtn = document.getElementById('btn-autoplay');
    const autoLbl = document.getElementById('autoplay-label');

    function getStages() {
      return Array.isArray(homeCms.stages) && homeCms.stages.length === 5
        ? homeCms.stages
        : DEFAULT_STAGES;
    }

    function applyStageCopy(idx, animate = true) {
      const stages = getStages();
      const st = stages[idx] || DEFAULT_STAGES[idx] || DEFAULT_STAGES[0];

      const updateText = () => {
        kickerEl.textContent = idx === 0 ? (homeCms.kicker || st.kicker) : st.kicker;
        titleEl.textContent = idx === 0 ? (homeCms.title || st.title) : st.title;
        subEl.textContent = idx === 0 ? (homeCms.subtitle || st.subtitle) : st.subtitle;
      };

      if (animate && copyCol) {
        copyCol.classList.add('swapping');
        window.setTimeout(() => {
          updateText();
          copyCol.classList.remove('swapping');
        }, 125);
      } else {
        updateText();
      }

      document.querySelectorAll('.stage-stop').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
        btn.setAttribute('aria-current', i === idx ? 'step' : 'false');
      });
    }

    function setFinaleVisibility(isFinale) {
      if (finaleEl) {
        finaleEl.classList.toggle('visible', isFinale);
        finaleEl.setAttribute('aria-hidden', isFinale ? 'false' : 'true');
      }
      if (cueEl) {
        cueEl.classList.toggle('hidden-cue', isFinale);
      }
    }

    function applyHomeCMS(cms) {
      homeCms = { ...homeCms, ...cms };
      const primaryLink = document.getElementById('cms-cta-primary');
      const primaryText = document.getElementById('cms-cta-primary-text');
      const secondaryLink = document.getElementById('cms-cta-secondary');
      const topEnter = document.getElementById('top-enter-link');

      if (primaryLink && homeCms.primaryCtaHref) primaryLink.href = homeCms.primaryCtaHref;
      if (primaryText && homeCms.primaryCtaLabel) primaryText.textContent = homeCms.primaryCtaLabel;
      if (topEnter && homeCms.primaryCtaHref) topEnter.href = homeCms.primaryCtaHref;
      if (secondaryLink) {
        if (homeCms.secondaryCtaLabel) secondaryLink.textContent = homeCms.secondaryCtaLabel;
        if (homeCms.secondaryCtaHref) secondaryLink.href = homeCms.secondaryCtaHref;
      }

      const stages = getStages();
      document.querySelectorAll('#stage-rail-stops .stage-stop').forEach((btn, i) => {
        const st = stages[i];
        if (!st) return;
        const spans = btn.querySelectorAll('span');
        if (spans[0]) spans[0].textContent = st.index || `۰${i + 1}`;
        if (spans[1]) spans[1].textContent = st.label || '';
      });

      applyStageCopy(activeStageIdx, false);
    }

    function stopAutoPlay() {
      if (!autoPlaying) return;
      autoPlaying = false;
      cancelAnimationFrame(autoPlayRaf);
      if (autoBtn) {
        autoBtn.setAttribute('aria-pressed', 'false');
        autoBtn.classList.remove('playing');
      }
      if (autoLbl) autoLbl.textContent = 'پخش خودکار';
    }

    function startAutoPlay() {
      const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
      if (window.scrollY >= maxScroll * 0.96) {
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      autoPlaying = true;
      if (autoBtn) {
        autoBtn.setAttribute('aria-pressed', 'true');
        autoBtn.classList.add('playing');
      }
      if (autoLbl) autoLbl.textContent = 'توقف پخش';

      const startY = window.scrollY;
      const remaining = Math.max(1, maxScroll - startY);
      const durationMs = Math.max(2400, (remaining / maxScroll) * 8800);
      const startTime = performance.now();

      const step = (now) => {
        if (!autoPlaying) return;
        const frac = Math.min(1, (now - startTime) / durationMs);
        // Smooth easeInOutSine for butter-smooth cinema glide
        const eased = -(Math.cos(Math.PI * frac) - 1) / 2;
        window.scrollTo(0, startY + remaining * eased);
        if (frac < 1) {
          autoPlayRaf = requestAnimationFrame(step);
        } else {
          stopAutoPlay();
        }
      };
      autoPlayRaf = requestAnimationFrame(step);
    }

    function initCinema() {
      const canvas = document.getElementById('hero-canvas');
      const fallback = document.getElementById('cinema-fallback');
      try {
        stageEngine = createPistachioCinemaStage(canvas);
        window.__mgzStage = stageEngine;
      } catch (err) {
        console.warn('Cinema WebGL fallback:', err);
        if (canvas) canvas.hidden = true;
        if (fallback) fallback.hidden = false;
      }

      const syncFromScroll = () => {
        const y = window.scrollY || 0;
        const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
        const progress = Math.max(0, Math.min(1, y / maxScroll));

        if (stageEngine) {
          stageEngine.setStage(null);
          stageEngine.setScrollProgress(progress);
        }

        // Pure GPU-composited scaleX progress bar (zero layout thrash)
        if (railFill) {
          railFill.style.transform = `scaleX(${progress.toFixed(4)})`;
        }

        const nextIdx = Math.min(4, Math.floor(progress * 4.999));
        if (nextIdx !== activeStageIdx) {
          activeStageIdx = nextIdx;
          applyStageCopy(activeStageIdx, true);
        }

        setFinaleVisibility(progress >= 0.82);
      };

      addEventListener('scroll', syncFromScroll, { passive: true });
      addEventListener('resize', syncFromScroll, { passive: true });
      addEventListener('wheel', stopAutoPlay, { passive: true });
      addEventListener('touchstart', stopAutoPlay, { passive: true });
      syncFromScroll();

      document.querySelectorAll('.stage-stop').forEach((btn) => {
        btn.addEventListener('click', () => {
          stopAutoPlay();
          const idx = Number(btn.dataset.stageIdx || 0);
          const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
          const targetY = (idx / 4) * maxScroll;
          window.scrollTo({ top: targetY, behavior: 'smooth' });
        });
      });

      if (autoBtn) {
        autoBtn.addEventListener('click', () => {
          if (autoPlaying) stopAutoPlay();
          else startAutoPlay();
        });
      }

      const replayBtn = document.getElementById('btn-replay');
      if (replayBtn) {
        replayBtn.addEventListener('click', () => {
          stopAutoPlay();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      // Keyboard navigation between the 5 stages
      addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          stopAutoPlay();
          const next = Math.min(4, activeStageIdx + 1);
          const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
          window.scrollTo({ top: (next / 4) * maxScroll, behavior: 'smooth' });
          e.preventDefault();
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          stopAutoPlay();
          const prev = Math.max(0, activeStageIdx - 1);
          const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
          window.scrollTo({ top: (prev / 4) * maxScroll, behavior: 'smooth' });
          e.preventDefault();
        }
      });
    }

    initCinema();

    // Hydrate live CMS copy if Firestore studio has customized any of the 5 stages or brand name
    function wireLiveCms() {
      if (!window.MgzCloud) return;
      window.MgzCloud.subscribeSiteContent('home', (cms) => {
        applyHomeCMS(cms);
      });
      window.MgzCloud.subscribeSiteContent('branding', (br) => {
        const brandEl = document.getElementById('cms-brand-name');
        if (br.siteName && brandEl) brandEl.textContent = br.siteName;
      });
    }

    if (window.MgzCloud) wireLiveCms();
    else window.addEventListener('mgzcloud:ready', wireLiveCms, { once: true });
  </script>
</body>
</html>
