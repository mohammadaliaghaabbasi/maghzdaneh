<!DOCTYPE html>
<html lang="fa" dir="rtl" class="prologue-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>مغزدانه | گالری تخصصی مغز پسته، بادام و گردوی دست‌اول</title>
  <meta name="description" content="مغزدانه — از دلِ صدف تا زمردِ خالص. گالری تخصصی مغز پسته اکبری، خلال سبز، بادام و گردوی دست‌اول رفسنجان و بازارچهٔ غرفه‌های باغداران.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=14">
  <link rel="manifest" href="manifest.webmanifest?v=25">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مغزدانه">
  <meta name="theme-color" content="#060907">
  <link rel="stylesheet" href="assets/css/fonts.css?v=14">
  <link rel="stylesheet" href="assets/css/main.css?v=20">
  <link rel="stylesheet" href="assets/css/fx.css?v=17">
  <meta property="og:title" content="مغزدانه — رازی در دلِ صدف، تا زمردِ خالص">
  <meta property="og:description" content="سفر سه‌بعدی پستهٔ اکبری رفسنجان از صدفِ بسته و جامهٔ ارغوانی تا زمردِ سبز خالص.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="src/assets/images/pistachio_kernel_pure_green_1795349498393.jpg">
  <meta property="og:locale" content="fa_IR">
</head>
<body class="home-page prologue-only">
  <!-- Minimal Floating Prologue Bar -->
  <header class="prologue-top" aria-label="ناوبری ورودی">
    <a class="brand" href="index.html" aria-label="مغزدانه">
      <img src="assets/img/logo.svg?v=14" alt="" width="36" height="36">
      <span class="brand-name" id="cms-brand-name">مغزدانه</span>
    </a>
    <div class="prologue-top-actions">
      <a class="prologue-skip-link" id="top-enter-link" href="catalog.html">ورود به سایت ←</a>
    </div>
  </header>

  <!-- ================= PURE FULL-SCREEN 5-STAGE 3D PISTACHIO PROLOGUE ================= -->
  <main class="cinema-stage-wrap" id="cinema-wrap" aria-label="سفر ۵-مرحله‌ای پسته واقعی از بسته تا مغز سبز خالص">
    <div class="cinema-sticky">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>

      <div class="cinema-fallback-img" id="cinema-fallback" hidden>
        <img src="src/assets/images/pistachio_kernel_pure_green_1795349498393.jpg" alt="مغز پسته سبز خالص اکبری رفسنجان">
      </div>

      <div class="cinema-scrim" aria-hidden="true"></div>

      <div class="cinema-copy-shell">
        <div class="cinema-copy-col" id="cinema-copy">
          <span class="cinema-kicker" id="cms-kicker">۰۱ · دست‌چین رفسنجان</span>
          <h1 class="cinema-title" id="cms-title">رازی در دلِ صدف.</h1>
          <p class="cinema-sub" id="cms-sub">دست‌چین باغ‌های رفسنجان؛ هنوز در حصار طبیعت.</p>

          <!-- Quiet Scroll Prompt (Visible on Stages 01–04) -->
          <div class="prologue-cue" id="prologue-cue">
            <span class="cue-line" aria-hidden="true"></span>
            <span class="cue-text">اسکرول کنید تا شکوفا شود</span>
          </div>

          <!-- Finale Gateway CTA (Blooms into prominence on Stage 05: Pure Emerald Kernel) -->
          <div class="finale-gateway" id="finale-gateway" aria-hidden="true">
            <a class="lux-btn-enter" id="cms-cta-primary" href="catalog.html">
              <span id="cms-cta-primary-text">ورود به سایت</span>
              <span class="enter-arrow" aria-hidden="true">←</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Side Circular Scroll-Progress Indicator (Numerical + Graphical) -->
      <aside class="stage-dial-wrap" aria-label="نشانگر دایره‌ای پیشرفت مراحل">
        <button
          type="button"
          class="stage-dial-btn"
          id="stage-dial"
          role="progressbar"
          aria-valuemin="1"
          aria-valuemax="5"
          aria-valuenow="1"
          aria-label="مرحله ۱ از ۵ — کلیک برای مرحله بعدی"
          title="مرحله بعدی"
        >
          <svg class="stage-dial-svg" viewBox="0 0 88 88" aria-hidden="true">
            <defs>
              <linearGradient id="stage-dial-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d6b569"/>
                <stop offset="65%" stop-color="#e5cd90"/>
                <stop offset="100%" stop-color="#6fd195"/>
              </linearGradient>
            </defs>
            <!-- Outer 5-Stage Radial Ticks -->
            <line class="stage-dial-tick passed" data-dial-tick="0" x1="44" y1="2.5" x2="44" y2="6.5" transform="rotate(0 44 44)"/>
            <line class="stage-dial-tick" data-dial-tick="1" x1="44" y1="2.5" x2="44" y2="6.5" transform="rotate(72 44 44)"/>
            <line class="stage-dial-tick" data-dial-tick="2" x1="44" y1="2.5" x2="44" y2="6.5" transform="rotate(144 44 44)"/>
            <line class="stage-dial-tick" data-dial-tick="3" x1="44" y1="2.5" x2="44" y2="6.5" transform="rotate(216 44 44)"/>
            <line class="stage-dial-tick" data-dial-tick="4" x1="44" y1="2.5" x2="44" y2="6.5" transform="rotate(288 44 44)"/>
            <!-- Base Ring -->
            <circle class="stage-dial-track" cx="44" cy="44" r="35"/>
            <!-- Live Progress Arc (circumference = 2 * PI * 35 = 219.911) -->
            <circle
              class="stage-dial-arc"
              id="stage-dial-arc"
              cx="44"
              cy="44"
              r="35"
              stroke-dasharray="219.911"
              stroke-dashoffset="175.929"
              transform="rotate(-90 44 44)"
            />
            <!-- Luminous Tip Dot Tracking Arc Head -->
            <g id="stage-dial-tip-group" transform="rotate(72 44 44)">
              <circle class="stage-dial-tip" cx="44" cy="9" r="2.6"/>
            </g>
          </svg>
          <span class="stage-dial-center">
            <span class="stage-dial-num" id="stage-dial-num">۰۱</span>
            <span class="stage-dial-total">از ۰۵</span>
          </span>
        </button>
        <span class="stage-dial-caption" id="stage-dial-caption">پوستهٔ بسته</span>
      </aside>

      <!-- Whisper-Thin 5-Stop Horizontal Timeline Rail (GPU scaleX + Clickable Stops) -->
      <nav class="stage-rail" aria-label="پنج مرحله باز شدن و پوست‌گیری پسته">
        <div class="stage-rail-track" aria-hidden="true">
          <div class="stage-rail-fill" id="stage-rail-fill"></div>
        </div>
        <div class="stage-rail-stops" id="stage-rail-stops">
          <button type="button" class="stage-stop active" data-stage-idx="0"><span class="st-idx">۰۱</span><span>پوستهٔ بسته</span></button>
          <button type="button" class="stage-stop" data-stage-idx="1"><span class="st-idx">۰۲</span><span>لبخند طبیعی</span></button>
          <button type="button" class="stage-stop" data-stage-idx="2"><span class="st-idx">۰۳</span><span>جامهٔ ارغوانی</span></button>
          <button type="button" class="stage-stop" data-stage-idx="3"><span class="st-idx">۰۴</span><span>پوست‌گیری آرام</span></button>
          <button type="button" class="stage-stop" data-stage-idx="4"><span class="st-idx">۰۵</span><span>زمردِ ناب</span></button>
        </div>
      </nav>
    </div>
  </main>

  <script src="assets/js/firebase-bundle.js?v=21" defer></script>
  <script type="module">
    import { createPistachioCinemaStage } from './assets/js/cinema-stage.js?v=12';

    const DEFAULT_STAGES = [
      {
        index: '۰۱',
        label: 'پوستهٔ بسته',
        kicker: '۰۱ · دست‌چین رفسنجان',
        title: 'رازی در دلِ صدف.',
        subtitle: 'دست‌چین باغ‌های رفسنجان؛ هنوز در حصار طبیعت.',
      },
      {
        index: '۰۲',
        label: 'لبخند طبیعی',
        kicker: '۰۲ · خندانی آفتابی',
        title: 'صدف، خود لبخند می‌زند.',
        subtitle: 'پوسته زیر آفتاب می‌شکافد و عطرِ تازه آزاد می‌شود.',
      },
      {
        index: '۰۳',
        label: 'جامهٔ ارغوانی',
        kicker: '۰۳ · مغزکنی تازه',
        title: 'پوسته می‌افتد؛ یاقوت می‌درخشد.',
        subtitle: 'مغزِ یک‌تکه در جامهٔ نازکِ ارغوانی، بی‌کوچک‌ترین آسیب.',
      },
      {
        index: '۰۴',
        label: 'پوست‌گیری آرام',
        kicker: '۰۴ · آشکارشدن زمرد',
        title: 'پردهٔ سرخ کنار می‌رود.',
        subtitle: 'پوستهٔ ارغوانی آرام می‌ریزد و سبزِ ناب سر برمی‌آورد.',
      },
      {
        index: '۰۵',
        label: 'زمردِ ناب',
        kicker: '۰۵ · جوهرِ مغزدانه',
        title: 'اینک، زمردِ خالص.',
        subtitle: 'ناب‌ترین مغزهای ایران، آمادهٔ انتخابِ شما.',
      },
    ];

    let homeCms = {
      kicker: DEFAULT_STAGES[0].kicker,
      title: DEFAULT_STAGES[0].title,
      subtitle: DEFAULT_STAGES[0].subtitle,
      primaryCtaLabel: 'ورود به سایت',
      primaryCtaHref: 'catalog.html',
      secondaryCtaLabel: 'خرید عمده',
      secondaryCtaHref: 'wholesale.html',
      stages: DEFAULT_STAGES,
    };

    let activeStageIdx = 0;
    let stageEngine = null;
    let animRaf = 0;

    const copyCol = document.getElementById('cinema-copy');
    const kickerEl = document.getElementById('cms-kicker');
    const titleEl = document.getElementById('cms-title');
    const subEl = document.getElementById('cms-sub');
    const cueEl = document.getElementById('prologue-cue');
    const finaleEl = document.getElementById('finale-gateway');
    const railFill = document.getElementById('stage-rail-fill');
    const wrap = document.getElementById('cinema-wrap');
    const dialBtn = document.getElementById('stage-dial');
    const dialArc = document.getElementById('stage-dial-arc');
    const dialTipGroup = document.getElementById('stage-dial-tip-group');
    const dialNum = document.getElementById('stage-dial-num');
    const dialCaption = document.getElementById('stage-dial-caption');
    const dialTicks = document.querySelectorAll('[data-dial-tick]');
    const DIAL_CIRCUMFERENCE = 2 * Math.PI * 35;

    document.documentElement.style.scrollBehavior = 'auto';

    function getStages() {
      return Array.isArray(homeCms.stages) && homeCms.stages.length === 5
        ? homeCms.stages
        : DEFAULT_STAGES;
    }

    function updateDialStage(idx, animate = true) {
      const stages = getStages();
      const st = stages[idx] || DEFAULT_STAGES[idx] || DEFAULT_STAGES[0];
      const faIndex = st.index || `۰${idx + 1}`;
      if (dialNum) {
        if (animate && dialNum.textContent !== faIndex) {
          dialNum.classList.add('tick-pop');
          window.setTimeout(() => {
            dialNum.textContent = faIndex;
            dialNum.classList.remove('tick-pop');
          }, 95);
        } else {
          dialNum.textContent = faIndex;
        }
      }
      if (dialCaption) {
        dialCaption.textContent = st.label || '';
      }
      if (dialBtn) {
        dialBtn.setAttribute('aria-valuenow', String(idx + 1));
        dialBtn.setAttribute(
          'aria-label',
          idx < 4
            ? `مرحله ${faIndex} از ۰۵: ${st.label || ''} — کلیک برای مرحله بعدی`
            : `مرحله ۰۵ از ۰۵: ${st.label || ''} — کلیک برای بازگشت به آغاز`
        );
        dialBtn.setAttribute('title', idx < 4 ? 'رفتن به مرحله بعدی' : 'بازگشت به مرحله اول');
        dialBtn.classList.toggle('is-complete', idx === 4);
      }
      dialTicks.forEach((tick, i) => {
        tick.classList.toggle('passed', i <= idx);
      });
    }

    function applyStageCopy(idx, animate = true) {
      const stages = getStages();
      const st = stages[idx] || DEFAULT_STAGES[idx] || DEFAULT_STAGES[0];

      const updateText = () => {
        kickerEl.textContent = idx === 0 ? (homeCms.kicker || st.kicker) : st.kicker;
        titleEl.textContent = idx === 0 ? (homeCms.title || st.title) : st.title;
        subEl.textContent = idx === 0 ? (homeCms.subtitle || st.subtitle) : st.subtitle;
      };

      if (animate && copyCol) {
        copyCol.classList.add('swapping');
        window.setTimeout(() => {
          updateText();
          copyCol.classList.remove('swapping');
        }, 115);
      } else {
        updateText();
      }

      document.querySelectorAll('.stage-stop').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
        btn.setAttribute('aria-current', i === idx ? 'step' : 'false');
      });

      updateDialStage(idx, animate);
    }

    function setFinaleVisibility(isFinale) {
      if (finaleEl) {
        finaleEl.classList.toggle('visible', isFinale);
        finaleEl.setAttribute('aria-hidden', isFinale ? 'false' : 'true');
      }
      if (cueEl) {
        cueEl.classList.toggle('hidden-cue', isFinale);
      }
    }

    function applyHomeCMS(cms) {
      if (!cms || typeof cms !== 'object') return;
      // Ignore obsolete legacy seeded copy if Firestore still holds the unedited old default
      if (cms.title === 'از پوستهٔ بسته، تا جوهرِ سبز.') return;
      homeCms = { ...homeCms, ...cms };
      const primaryLink = document.getElementById('cms-cta-primary');
      const primaryText = document.getElementById('cms-cta-primary-text');
      const secondaryLink = document.getElementById('cms-cta-secondary');
      const topEnter = document.getElementById('top-enter-link');

      if (primaryLink && homeCms.primaryCtaHref) primaryLink.href = homeCms.primaryCtaHref;
      if (primaryText && homeCms.primaryCtaLabel) primaryText.textContent = homeCms.primaryCtaLabel;
      if (topEnter && homeCms.primaryCtaHref) topEnter.href = homeCms.primaryCtaHref;
      if (secondaryLink) {
        if (homeCms.secondaryCtaLabel) secondaryLink.textContent = homeCms.secondaryCtaLabel;
        if (homeCms.secondaryCtaHref) secondaryLink.href = homeCms.secondaryCtaHref;
      }

      const stages = getStages();
      document.querySelectorAll('#stage-rail-stops .stage-stop').forEach((btn, i) => {
        const st = stages[i];
        if (!st) return;
        const spans = btn.querySelectorAll('span');
        if (spans[0]) spans[0].textContent = st.index || `۰${i + 1}`;
        if (spans[1]) spans[1].textContent = st.label || '';
      });

      applyStageCopy(activeStageIdx, false);
    }

    function syncProgress(progress) {
      const clamped = Math.max(0, Math.min(1, progress));
      if (stageEngine) {
        stageEngine.setStage(null);
        stageEngine.setScrollProgress(clamped);
      }
      if (railFill) {
        railFill.style.transform = `scaleX(${clamped.toFixed(4)})`;
      }
      const dialRatio = 0.2 + clamped * 0.8;
      if (dialArc) {
        dialArc.style.strokeDashoffset = (DIAL_CIRCUMFERENCE * (1 - dialRatio)).toFixed(2);
      }
      if (dialTipGroup) {
        dialTipGroup.setAttribute('transform', `rotate(${(dialRatio * 360).toFixed(1)} 44 44)`);
      }
      const nextIdx = Math.min(4, Math.floor(clamped * 4.999));
      if (nextIdx !== activeStageIdx) {
        activeStageIdx = nextIdx;
        applyStageCopy(activeStageIdx, true);
      }
      setFinaleVisibility(clamped >= 0.82);
    }

    function cancelAnimation() {
      if (animRaf) {
        cancelAnimationFrame(animRaf);
        animRaf = 0;
      }
    }

    function glideScrollTo(targetProgress, durationMs = 1450) {
      cancelAnimation();
      const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
      const startY = window.scrollY || 0;
      const endY = Math.round(Math.max(0, Math.min(1, targetProgress)) * maxScroll);
      const delta = endY - startY;

      const startTime = performance.now();
      const step = (now) => {
        const frac = Math.min(1, (now - startTime) / Math.max(300, durationMs));
        const eased = -(Math.cos(Math.PI * frac) - 1) / 2;
        const curY = startY + delta * Math.max(0, Math.min(1, eased));
        window.scrollTo({ top: curY, behavior: 'instant' });
        syncProgress(curY / maxScroll);

        if (frac < 1) {
          animRaf = requestAnimationFrame(step);
        } else {
          animRaf = 0;
        }
      };
      animRaf = requestAnimationFrame(step);
    }

    function initCinema() {
      const canvas = document.getElementById('hero-canvas');
      const fallback = document.getElementById('cinema-fallback');
      try {
        stageEngine = createPistachioCinemaStage(canvas);
        window.__mgzStage = stageEngine;
      } catch (err) {
        console.warn('Cinema WebGL fallback:', err);
        if (canvas) canvas.hidden = true;
        if (fallback) fallback.hidden = false;
      }

      const syncFromScroll = () => {
        const y = window.scrollY || 0;
        const maxScroll = Math.max(1, wrap.offsetHeight - window.innerHeight);
        syncProgress(y / maxScroll);
      };

      addEventListener('scroll', syncFromScroll, { passive: true });
      addEventListener('resize', syncFromScroll, { passive: true });
      addEventListener('wheel', cancelAnimation, { passive: true });
      addEventListener('touchstart', cancelAnimation, { passive: true });
      syncFromScroll();

      document.querySelectorAll('.stage-stop').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.stageIdx || 0);
          glideScrollTo(idx / 4, 1450);
        });
      });

      if (dialBtn) {
        dialBtn.addEventListener('click', () => {
          const next = activeStageIdx < 4 ? activeStageIdx + 1 : 0;
          glideScrollTo(next / 4, 1350);
        });
      }

      addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          const next = Math.min(4, activeStageIdx + 1);
          glideScrollTo(next / 4, 1300);
          e.preventDefault();
        } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
          const prev = Math.max(0, activeStageIdx - 1);
          glideScrollTo(prev / 4, 1300);
          e.preventDefault();
        }
      });
    }

    initCinema();

    // 1. Hydrate from server-backed CMS API (works with Admin username/password edits)
    fetch('/api/cms/home', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((res) => { if (res && res.data) applyHomeCMS(res.data); })
      .catch(() => {});

    fetch('/api/cms/branding', { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : null))
      .then((res) => {
        const brandEl = document.getElementById('cms-brand-name');
        if (res && res.data && res.data.siteName && brandEl) brandEl.textContent = res.data.siteName;
      })
      .catch(() => {});

    // 2. Also subscribe to Firestore CMS if signed-in Google Admin updates live
    function wireLiveCms() {
      if (!window.MgzCloud) return;
      window.MgzCloud.subscribeSiteContent('home', (cms) => applyHomeCMS(cms));
      window.MgzCloud.subscribeSiteContent('branding', (br) => {
        const brandEl = document.getElementById('cms-brand-name');
        if (br.siteName && brandEl) brandEl.textContent = br.siteName;
      });
    }
    if (window.MgzCloud) wireLiveCms();
    else window.addEventListener('mgzcloud:ready', wireLiveCms, { once: true });

    // 3. Register PWA Service Worker from entry page (subpath-safe for GitHub Pages & root domains)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
    }
  </script>
</body>
</html>
