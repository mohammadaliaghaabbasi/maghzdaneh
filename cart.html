<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سبد خرید | مغزدانه</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/fx.css">
  <meta name="theme-color" content="#07100b">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="page-head">
    <div class="container">
      <span class="sec-label">بررسی نهایی قبل از تسویه</span>
      <h1>سبد خرید شما</h1>
      <p>وزن و پله خرید هر محصول را بررسی کنید؛ در صورت نزدیک شدن به سقف پله بعدی، پیشنهاد ارتقا به شما نمایش داده می‌شود.</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div id="cart-area"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    boot('').then(db => {
      function render() {
        const area = document.getElementById('cart-area');
        if (!APP.cart.length) {
          area.innerHTML = `
            <div class="empty">
              <div class="big">${icon('cart')}</div>
              <p style="color:#fff;font-weight:800">سبد خرید شما خالی است</p>
              <p style="margin:8px 0 20px;font-size:var(--fs-sm)">از کاتالوگ مغزها، محصول مورد نظرتان را از ۲۵۰ گرم تا ۲۵ کیلو انتخاب کنید.</p>
              <a class="btn btn-primary" href="catalog.html">رفتن به کاتالوگ</a>
            </div>`;
          return;
        }

        const ship = db.site.shipping;
        const rows = APP.cart.map((it, idx) => {
          const p = byId(it.id);
          if (!p) return '';
          const unit = p.prices[it.tier] || p.prices.retail;
          const minQ = tierMin(it.tier);
          const step = it.tier === 'wholesale' ? 5 : it.tier === 'semi' ? 1 : 0.25;
          let upgradeHtml = '';
          if (it.tier === 'retail' && it.qty >= 3) {
            const pct = Math.round((1 - p.prices.semi / p.prices.retail) * 100);
            upgradeHtml = `<div class="tier-upgrade-tip"><span>با ۵ کیلو ٪${fmt(pct)} تخفیف نیم‌عمده بگیرید</span><button type="button" data-upg="${idx}" data-to="semi">ارتقا به نیم‌عمده</button></div>`;
          } else if (it.tier === 'semi' && it.qty >= 18) {
            const pct = Math.round((1 - p.prices.wholesale / p.prices.retail) * 100);
            upgradeHtml = `<div class="tier-upgrade-tip"><span>با ۲۵ کیلو ٪${fmt(pct)} تخفیف عمده بگیرید</span><button type="button" data-upg="${idx}" data-to="wholesale">ارتقا به عمده</button></div>`;
          }
          return `
          <tr>
            <td><a href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}" referrerpolicy="no-referrer" onerror="mgzImgFallback(this,'${p.name}')"></a></td>
            <td>
              <a href="product.html?id=${p.id}" style="color:#fff;font-weight:800">${p.name}</a><br>
              <span style="color:var(--c-text-soft);font-size:var(--fs-xs)">پله: ${tierLabel(it.tier)} · حداقل ${fmt(minQ)} کیلو</span>
              ${upgradeHtml}
            </td>
            <td style="white-space:nowrap">${fmt(unit)}</td>
            <td style="min-width:136px">
              <div class="qty-box" style="max-width:144px">
                <button type="button" data-dec="${idx}" data-step="${step}" aria-label="کاهش" ${it.qty <= minQ ? 'disabled style="opacity:0.35"' : ''}>−</button>
                <input type="number" min="${minQ}" step="${step}" value="${it.qty}" data-q="${idx}" style="width:58px" aria-label="مقدار">
                <button type="button" data-inc="${idx}" data-step="${step}" aria-label="افزایش">+</button>
              </div>
            </td>
            <td style="font-weight:900;white-space:nowrap;color:var(--c-primary-light)">${fmt(Math.round(unit * it.qty))}</td>
            <td><button type="button" class="rm-btn" data-rm="${idx}" aria-label="حذف">${icon('trash')}</button></td>
          </tr>`;
        }).join('');

        const t = cartTotals();
        const pct = Math.min(100, Math.round((t.subtotal / Math.max(1, t.freeOver)) * 100));

        area.innerHTML = `
          <div style="display:grid;gap:24px;grid-template-columns:minmax(0, 2fr) minmax(0, 1fr);align-items:start" class="cart-layout">
            <div class="table-wrap">
              <table class="shop">
                <thead><tr><th></th><th>محصول و پله</th><th>قیمت کیلو</th><th>وزن (کیلو)</th><th>جمع (تومان)</th><th></th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <aside class="cart-summary">
              <h3>خلاصه سفارش</h3>
              <div class="sum-row"><span>مجموع وزن</span><span>${fmt(t.totalKg)} کیلوگرم</span></div>
              <div class="sum-row"><span>جمع کالاها</span><span>${faToman(t.subtotal)}</span></div>
              <div class="sum-row"><span>هزینه ارسال</span><span>${t.freeShip ? 'رایگان' : faToman(t.shipCost)}</span></div>
              <div class="ship-progress"><i style="width:${pct}%"></i></div>
              <div class="sum-row total"><span>قابل پرداخت</span><span>${faToman(t.grand)}</span></div>
              ${!t.freeShip ? `<p class="free-ship-note">با ${faToman(t.freeOver - t.subtotal)} خرید بیشتر، ارسال رایگان می‌شود.</p>` : `<p class="free-ship-note" style="color:var(--c-primary-light)">سفارش شما مشمول ارسال رایگان است.</p>`}
              ${t.totalKg > 10 ? `<p class="free-ship-note">${ship.heavy_note}</p>` : ''}
              <a class="btn btn-primary" href="checkout.html" style="width:100%;margin-top:16px">ادامه تسویه‌حساب</a>
              <a class="btn btn-outline" href="catalog.html" style="width:100%;margin-top:10px">افزودن محصول بیشتر</a>
            </aside>
          </div>`;

        area.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeFromCart(+b.dataset.rm));
        area.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => setCartItemQty(+b.dataset.dec, APP.cart[+b.dataset.dec].qty - parseFloat(b.dataset.step)));
        area.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => setCartItemQty(+b.dataset.inc, APP.cart[+b.dataset.inc].qty + parseFloat(b.dataset.step)));
        area.querySelectorAll('[data-q]').forEach(inp => inp.onchange = () => setCartItemQty(+inp.dataset.q, parseFloat(inp.value)));
        area.querySelectorAll('[data-upg]').forEach(b => b.onclick = () => upgradeCartItemTier(+b.dataset.upg, b.dataset.to));
      }

      render();
      document.addEventListener('cart:changed', render);
      if (window.MGZ) MGZ.init();
    });
  </script>
  <style>
    @media (max-width: 900px) { .cart-layout { grid-template-columns: 1fr !important; } }
  </style>
</body>
</html>
