<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>تسویه‌حساب | مغزدانه</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg?v=14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مغزدانه">
  <meta name="theme-color" content="#060907">
  <link rel="stylesheet" href="assets/css/fonts.css?v=14">
  <link rel="stylesheet" href="assets/css/main.css?v=19">
  <link rel="stylesheet" href="assets/css/fx.css?v=17">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="page-head">
    <div class="container">
      <span class="sec-label">ثبت سفارش سریع و مطمئن</span>
      <h1>تسویه‌حساب</h1>
      <p>اطلاعات خریدار، نشانی ارسال، کد تخفیف و روش پرداخت را کامل کنید؛ رسید و کد پیگیری بلافاصله صادر می‌شود.</p>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="co-steps" aria-label="مراحل تسویه‌حساب">
        <span class="co-step active"><b>۱</b> اطلاعات خریدار</span>
        <span style="color:var(--c-text-muted)">←</span>
        <span class="co-step active"><b>۲</b> آدرس و ارسال</span>
        <span style="color:var(--c-text-muted)">←</span>
        <span class="co-step active"><b>۳</b> روش پرداخت و ثبت نهایی</span>
      </div>
      <div id="co-area"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/app.js?v=20"></script>
  <script src="assets/js/motion.js?v=12"></script>
  <script src="assets/js/ghdb.js?v=12"></script>
  <script>
    boot('').then(db => {
      const area = document.getElementById('co-area');

      function render() {
        if (!APP.cart.length) {
          area.innerHTML = `
            <div class="empty">
              <div class="big">${icon('cart')}</div>
              <p style="color:#fff;font-weight:800">سبدی برای تسویه وجود ندارد</p>
              <a class="btn btn-primary" href="catalog.html" style="margin-top:16px">رفتن به فروشگاه</a>
            </div>`;
          return;
        }
        const t = cartTotals();
        area.innerHTML = `
        <form id="co-form" style="display:grid;gap:24px;grid-template-columns:minmax(0, 1.8fr) minmax(0, 1fr);align-items:start" class="co-layout">
          <div style="display:grid;gap:18px">
            <div class="contact-card">
              <h3>۱. اطلاعات خریدار</h3>
              <div class="form-grid">
                <div class="field"><label for="f-name">نام و نام خانوادگی *</label><input id="f-name" required placeholder="مثلاً علی رضایی"></div>
                <div class="field"><label for="f-phone">شماره موبایل *</label><input id="f-phone" required inputmode="tel" pattern="09[0-9]{9}" placeholder="09xxxxxxxxx" style="direction:ltr;text-align:right"></div>
                <div class="field form-full"><label for="f-email">ایمیل (اختیاری)</label><input id="f-email" type="email" placeholder="you@example.com" style="direction:ltr;text-align:right"></div>
              </div>
            </div>

            <div class="contact-card">
              <h3>۲. آدرس و محاسبه هوشمند ارسال</h3>
              <div class="form-grid">
                <div class="field"><label for="f-prov">استان *</label><input id="f-prov" required placeholder="مثلاً تهران"></div>
                <div class="field"><label for="f-city">شهر *</label><input id="f-city" required placeholder="مثلاً تهران"></div>
                <div class="field form-full"><label for="f-addr">آدرس کامل پستی *</label><textarea id="f-addr" required rows="3" placeholder="خیابان، کوچه، پلاک، واحد"></textarea></div>
                <div class="field"><label for="f-post">کد پستی</label><input id="f-post" inputmode="numeric" placeholder="۱۰ رقم" style="direction:ltr;text-align:right"></div>
                <div class="field"><label for="f-ship">روش ارسال (برآورد هوشمند)</label>
                  <select id="f-ship">
                    <option value="tipax">تیپاکس (۲–۴ روز کاری)</option>
                    <option value="post">پست پیشتاز (۳–۵ روز کاری)</option>
                    <option value="tehran-courier" ${!db.site.shipping.tehran_same_day ? 'disabled' : ''}>پیک سریع تهران (همان‌روز — فقط تهران)</option>
                    <option value="freight">باربری عمده (پیشنهادی برای ۲۵ کیلو به بالا)</option>
                  </select>
                </div>
                <div class="field form-full" id="slot-wrap" hidden>
                  <label for="f-slot">بازهٔ زمانی تحویل پیک تهران</label>
                  <select id="f-slot">
                    <option value="امروز ۱۴ تا ۱۷">امروز ۱۴:۰۰ تا ۱۷:۰۰</option>
                    <option value="امروز ۱۷ تا ۲۰">امروز ۱۷:۰۰ تا ۲۰:۰۰</option>
                    <option value="فردا ۱۰ تا ۱۴">فردا ۱۰:۰۰ تا ۱۴:۰۰</option>
                  </select>
                </div>
              </div>
              <div id="ship-estimate-note" style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--c-line);font-size:var(--fs-xs);color:var(--c-text-soft)"></div>
            </div>

            <div class="contact-card">
              <h3>۳. فاکتور رسمی شرکتی و پرداخت امن</h3>
              <div style="padding:11px 14px;border-radius:10px;background:rgba(16,34,23,0.75);border:1px solid rgba(82,199,136,0.28);font-size:var(--fs-xs);color:var(--c-text-soft);margin-bottom:14px">
                <strong style="color:var(--c-primary-light)">🛡 ضمانت پرداخت امن امانی (Escrow مغزدانه):</strong>
                مبلغ سفارش شما (به‌ویژه خرید از غرفه‌های بازارچه) تا تحویل سالم و تأیید کیفیت ۷ روزه نزد مغزدانه امانت می‌ماند.
              </div>

              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-sm);color:#fff;font-weight:700;margin-bottom:12px">
                <input type="checkbox" id="f-vat-toggle" style="width:auto">
                <span>درخواست فاکتور رسمی شرکتی (مشمول ارزش‌افزوده و کد اقتصادی)</span>
              </label>
              <div id="vat-fields" hidden class="form-grid" style="margin-bottom:16px;padding:12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--c-line)">
                <div class="field form-full"><label for="f-comp-name">نام حقوقی شرکت / قنادی</label><input id="f-comp-name" placeholder="شرکت صنایع غذایی …"></div>
                <div class="field"><label for="f-comp-nid">شناسه ملی</label><input id="f-comp-nid" class="ltr" placeholder="1400xxxxxxx" style="text-align:right"></div>
                <div class="field"><label for="f-comp-eco">کد اقتصادی</label><input id="f-comp-eco" class="ltr" placeholder="411xxxxxxxxx" style="text-align:right"></div>
              </div>

              <div class="pay-methods">
                ${APP.serverUser ? (() => {
                  const bal = Math.max(0, Math.round(Number(APP.serverUser.walletBalance) || 0));
                  const enough = bal >= t.grand;
                  return `
                  <label class="pay-opt ${enough ? 'sel' : ''}" style="${enough ? '' : 'opacity:0.78'}">
                    <input type="radio" name="pay" value="wallet" ${enough ? 'checked' : ''} ${enough ? '' : 'disabled'}>
                    <span style="display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;flex-wrap:wrap">
                      <span><strong>پرداخت آنی از کیف پول مغزدانه</strong> (موجودی: <b class="${enough ? 'st-ok' : 'st-warn'}">${faToman(bal)}</b>)</span>
                      ${enough ? '<span class="st-ok" style="font-size:0.78rem">تسویه فوری</span>' : `<a href="account.html#wallet" style="color:var(--c-accent-light);font-size:0.78rem;font-weight:700">موجودی کافی نیست — شارژ کیف پول ←</a>`}
                    </span>
                  </label>`;
                })() : ''}
                ${db.site.payment.methods.map((m, i) => {
                  const walletDefault = Boolean(APP.serverUser && (Number(APP.serverUser.walletBalance) || 0) >= t.grand);
                  const isSel = !walletDefault && i === 0;
                  return `
                  <label class="pay-opt ${isSel ? 'sel' : ''}">
                    <input type="radio" name="pay" value="${i}" ${isSel ? 'checked' : ''}>
                    <span>${m} ${i === 0 ? '<small style="color:var(--c-accent-light)">(درگاه آزمایشی شاپرک / زرین‌پال — دمو)</small>' : ''}</span>
                  </label>`;
                }).join('')}
                <label class="pay-opt">
                  <input type="radio" name="pay" value="sayadi">
                  <span>پرداخت اعتباری / چک صیادی (ویژه خریداران عمده و قنادی — دمو)</span>
                </label>
              </div>
              <p class="hint" style="font-size:var(--fs-xs);color:var(--c-text-soft);margin-top:10px">${APP.serverUser ? 'سفارش‌های پرداخت‌شده با کیف پول یا درگاه آنلاین بلافاصله وارد صف آماده‌سازی می‌شوند.' : 'برای پرداخت آنی از کیف پول، ابتدا <a href="account.html?next=checkout.html" style="color:var(--c-accent-light)">وارد حساب کاربری</a> شوید.'} درگاه زرین‌پال/شاپرک در حال حاضر روی حالت شبیه‌ساز دمو فعال است و با ثبت کلید API در محیط سرور به درگاه واقعی متصل می‌شود.</p>
              <div class="field" style="margin-top:16px">
                <label for="f-note">یادداشت سفارش (اختیاری)</label>
                <textarea id="f-note" rows="2" placeholder="مثلاً: بسته‌بندی جدا برای هر کیلو، یا زمان تماس پیک"></textarea>
              </div>
            </div>
          </div>

          <aside class="cart-summary">
            <h3>خلاصه سفارش</h3>
            ${APP.cart.map(it => {
              const meta = cartItemMeta(it);
              if (!meta) return '';
              const u = cartItemUnit(it);
              return `<div class="sum-row"><span>${esc(meta.name)} × ${fmt(it.qty)} ${meta.unitLabel}${it.variantLabel ? `<br><small style="color:var(--c-accent-light)">${esc(it.variantLabel)}</small>` : ''}</span><span class="num">${fmt(Math.round(u * it.qty))}</span></div>`;
            }).join('')}
            <div class="sum-row"><span>وزن کل</span><span>${fmt(t.totalKg)} کیلوگرم</span></div>
            <div class="sum-row"><span>جمع کالاها</span><span>${faToman(t.subtotal)}</span></div>
            ${t.discount > 0 ? `<div class="sum-row" style="color:var(--c-primary-light)"><span>کد تخفیف (${esc(t.couponCode)})</span><span>− ${faToman(t.discount)}</span></div>` : ''}
            <div class="sum-row"><span>هزینه ارسال هوشمند</span><span id="co-ship-val">${t.shipCost ? faToman(t.shipCost) : 'رایگان'}</span></div>
            <div class="sum-row total"><span>قابل پرداخت</span><span id="co-grand-val">${faToman(t.grand)}</span></div>

            <div class="coupon-box">
              <label for="co-coupon-inp" style="font-size:var(--fs-xs);font-weight:800;color:var(--c-accent-light)">کد تخفیف</label>
              <div class="coupon-row">
                <input id="co-coupon-inp" class="ltr" value="${esc((APP.coupon && APP.coupon.code) || '')}" placeholder="MAGHZ10">
                <button type="button" class="btn btn-outline btn-sm" id="co-apply-coupon">اعمال</button>
              </div>
            </div>

            <button class="btn btn-primary" type="submit" style="width:100%;margin-top:16px" id="submit-btn">ثبت نهایی سفارش</button>
            <button type="button" class="btn btn-outline btn-sm" id="co-proforma" style="width:100%;margin-top:10px">${icon('receipt')} پیش‌فاکتور رسمی (PDF)</button>
            <p class="hint" style="font-size:var(--fs-xs);color:var(--c-text-soft);margin-top:10px">با ثبت سفارش، <a href="legal.html">قوانین فروش</a> مغزدانه را می‌پذیرید.</p>
          </aside>
        </form>

        <!-- Demo Shaparak / ZarinPal Payment Gateway Modal -->
        <div class="modal-back" id="demo-gw-modal">
          <div class="modal" role="dialog" aria-modal="true" style="max-width:440px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <span class="sec-label" style="margin:0;color:var(--c-accent-light)">شبیه‌ساز درگاه پرداخت (حالت دمو)</span>
              <button type="button" class="drawer-close" id="gw-cancel-x" aria-label="انصراف">×</button>
            </div>
            <h3 style="margin:0 0 6px;color:#fff">درگاه پرداخت امن شاپرک / زرین‌پال (Sandbox)</h3>
            <p style="font-size:var(--fs-xs);color:var(--c-text-soft);margin-bottom:14px">این پنجره محیط آزمایشی پرداخت آنلاین است. پس از قرار دادن کلید <code>ZARINPAL_MERCHANT_ID</code> در سرور، به درگاه بانکی واقعی هدایت می‌شود.</p>
            <div style="padding:12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--c-line);display:grid;gap:6px;font-size:var(--fs-xs);margin-bottom:14px">
              <div style="display:flex;justify-content:space-between"><span>پذیرنده:</span><strong style="color:#fff">فروشگاه تخصصی مغزدانه</strong></div>
              <div style="display:flex;justify-content:space-between"><span>شماره سفارش:</span><strong class="ltr" id="gw-order-code">—</strong></div>
              <div style="display:flex;justify-content:space-between"><span>مبلغ قابل پرداخت:</span><strong class="num" style="color:var(--c-primary-light)" id="gw-amount">—</strong></div>
            </div>
            <div style="display:grid;gap:8px">
              <button type="button" class="btn btn-primary" id="gw-approve-btn" style="width:100%">✓ تأیید پرداخت موفق (دمو)</button>
              <button type="button" class="btn btn-outline btn-sm" id="gw-reject-btn" style="width:100%">انصراف و بازگشت به تسویه‌حساب</button>
            </div>
          </div>
        </div>`;

        document.querySelectorAll('.pay-opt input').forEach(r => r.addEventListener('change', () => {
          document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('sel'));
          r.closest('.pay-opt').classList.add('sel');
        }));

        const vatToggle = document.getElementById('f-vat-toggle');
        const vatFields = document.getElementById('vat-fields');
        vatToggle.addEventListener('change', () => { vatFields.hidden = !vatToggle.checked; });

        // Dynamic Province + Weight + Carrier Shipping Estimator
        let dynamicShipCost = t.shipCost;
        function recalcSmartShipping() {
          const prov = (document.getElementById('f-prov').value || '').trim();
          const carrier = document.getElementById('f-ship').value;
          const slotWrap = document.getElementById('slot-wrap');
          const noteEl = document.getElementById('ship-estimate-note');
          slotWrap.hidden = carrier !== 'tehran-courier';

          const isTehran = prov.includes('تهران') || prov.includes('البرز');
          const freeThreshold = db.site.shipping.free_over || 3000000;
          let estCost = 0;
          let eta = '۲ تا ۴ روز کاری';

          if (carrier === 'freight') {
            estCost = t.totalKg >= 25 ? 0 : 140000;
            eta = '۱ تا ۲ روز کاری (تحویل پای باربری شهر مقصد)';
          } else if (t.subtotal >= freeThreshold && carrier !== 'tehran-courier') {
            estCost = 0;
            eta = isTehran ? '۱ تا ۲ روز کاری' : '۲ تا ۴ روز کاری';
          } else if (carrier === 'tehran-courier') {
            estCost = 120000;
            eta = 'تحویل همان‌روز در بازهٔ انتخابی (ویژه تهران)';
          } else if (carrier === 'post') {
            estCost = Math.round((isTehran ? 65000 : 85000) + Math.max(0, t.totalKg - 1) * 18000);
            eta = isTehran ? '۲ تا ۳ روز کاری' : '۳ تا ۵ روز کاری';
          } else {
            estCost = Math.round((isTehran ? 75000 : 105000) + Math.max(0, t.totalKg - 1) * 22000);
            eta = isTehran ? '۱ تا ۲ روز کاری' : '۲ تا ۴ روز کاری';
          }

          dynamicShipCost = estCost;
          const liveGrand = Math.max(0, t.subtotal - t.discount + dynamicShipCost);
          document.getElementById('co-ship-val').textContent = dynamicShipCost ? faToman(dynamicShipCost) : 'رایگان';
          document.getElementById('co-grand-val').textContent = faToman(liveGrand);
          noteEl.innerHTML = `📦 برآورد ارسال (${fmt(t.totalKg)} کیلوگرم${prov ? ` به ${esc(prov)}` : ''}): <strong style="color:#fff">${dynamicShipCost ? faToman(dynamicShipCost) : 'رایگان'}</strong> · زمان تحویل تقریبی: <strong style="color:var(--c-primary-light)">${eta}</strong>`;
        }

        document.getElementById('f-prov').addEventListener('input', recalcSmartShipping);
        document.getElementById('f-ship').addEventListener('change', recalcSmartShipping);
        recalcSmartShipping();

        document.getElementById('co-proforma').onclick = () => openInvoiceModal();

        document.getElementById('co-apply-coupon').onclick = async () => {
          const code = document.getElementById('co-coupon-inp').value.trim();
          if (!code) { clearCoupon(); return; }
          try {
            const res = await apiFetch('/api/coupons/validate', {
              method: 'POST',
              body: JSON.stringify({ code, subtotal: t.subtotal }),
            });
            setCoupon({ ...res.coupon, discount: res.discount });
            toast(`کد تخفیف «${res.coupon.code}» اعمال شد`);
          } catch (err) {
            clearCoupon();
            toast(err.message || 'کد تخفیف معتبر نیست');
          }
        };

        async function runDemoGatewayModal(orderCode, amount) {
          return new Promise(resolve => {
            const modal = document.getElementById('demo-gw-modal');
            document.getElementById('gw-order-code').textContent = orderCode;
            document.getElementById('gw-amount').textContent = faToman(amount);
            modal.classList.add('open');

            const cleanup = () => {
              modal.classList.remove('open');
              document.getElementById('gw-approve-btn').onclick = null;
              document.getElementById('gw-reject-btn').onclick = null;
              document.getElementById('gw-cancel-x').onclick = null;
            };
            document.getElementById('gw-approve-btn').onclick = async () => {
              let refId = 'ZP-DEMO-' + Math.floor(100000 + Math.random() * 900000);
              try {
                const gw = await apiFetch('/api/payments/demo-gateway', {
                  method: 'POST',
                  body: JSON.stringify({ orderCode, amount, action: 'approve' }),
                });
                if (gw && gw.refId) refId = gw.refId;
              } catch {}
              cleanup();
              resolve({ ok: true, refId });
            };
            const reject = () => { cleanup(); resolve({ ok: false }); };
            document.getElementById('gw-reject-btn').onclick = reject;
            document.getElementById('gw-cancel-x').onclick = reject;
          });
        }

        document.getElementById('co-form').addEventListener('submit', async e => {
          e.preventDefault();
          const btn = document.getElementById('submit-btn');
          btn.disabled = true;
          btn.textContent = 'در حال بررسی سفارش…';
          const selectedPayVal = document.querySelector('input[name="pay"]:checked').value;
          const isWalletPay = selectedPayVal === 'wallet';
          const isSayadiPay = selectedPayVal === 'sayadi';
          const isOnlineGateway = selectedPayVal === '0';
          const liveT = cartTotals();
          const finalShip = dynamicShipCost;
          const computedGrand = Math.max(0, liveT.subtotal - liveT.discount + finalShip);
          const orderCode = 'MD-' + Date.now().toString(36).toUpperCase();

          let paymentRefId = '';
          if (isOnlineGateway) {
            const gwRes = await runDemoGatewayModal(orderCode, computedGrand);
            if (!gwRes.ok) {
              btn.disabled = false;
              btn.textContent = 'ثبت نهایی سفارش';
              toast('پرداخت درگاه آزمایشی لغو شد');
              return;
            }
            paymentRefId = gwRes.refId;
          }

          btn.textContent = 'در حال ثبت نهایی سفارش…';
          const vatEnabled = document.getElementById('f-vat-toggle').checked;
          const shipSelect = document.getElementById('f-ship');
          const slotText = shipSelect.value === 'tehran-courier' ? ` (${document.getElementById('f-slot').value})` : '';
          const corporateInvoice = vatEnabled ? {
            requested: true,
            companyName: document.getElementById('f-comp-name').value.trim(),
            nationalId: document.getElementById('f-comp-nid').value.trim(),
            economicCode: document.getElementById('f-comp-eco').value.trim(),
          } : null;

          const order = {
            id: orderCode,
            date: new Date().toISOString(),
            customer: {
              name: document.getElementById('f-name').value.trim(),
              phone: document.getElementById('f-phone').value.trim(),
              email: document.getElementById('f-email').value.trim(),
              province: document.getElementById('f-prov').value.trim(),
              city: document.getElementById('f-city').value.trim(),
              address: document.getElementById('f-addr').value.trim(),
              postal: document.getElementById('f-post').value.trim(),
            },
            shipping: shipSelect.selectedOptions[0].textContent + slotText,
            payment: isWalletPay
              ? 'پرداخت آنلاین از کیف پول مغزدانه'
              : isSayadiPay
                ? 'پرداخت اعتباری / چک صیادی (عمده — دمو)'
                : db.site.payment.methods[+selectedPayVal] + (paymentRefId ? ` (کد پیگیری ${paymentRefId})` : ''),
            paymentMethod: isWalletPay ? 'wallet' : isSayadiPay ? 'sayadi' : 'gateway',
            paymentRefId,
            escrowProtected: true,
            corporateInvoice,
            couponCode: liveT.couponCode || '',
            discountAmount: liveT.discount || 0,
            note: document.getElementById('f-note').value.trim(),
            items: APP.cart.map(it => {
              const custom = isCustomCartItem(it);
              const p = custom ? null : byId(it.id);
              const u = cartItemUnit(it);
              return {
                id: it.id,
                kind: it.kind || null,
                name: custom ? it.name : p.name,
                tier: it.tier || 'retail',
                qty: it.qty,
                weightKg: custom ? Number(it.weightKg || 0.5) : Number(it.qty || 1),
                variantDelta: Number(it.variantDelta || 0),
                variantLabel: it.variantLabel || '',
                unit: u,
                unitPrice: u,
                lineTotal: Math.round(u * it.qty),
                total: Math.round(u * it.qty),
                vendorId: (p && p.vendorId) || null,
                vendorName: (p && p.vendorName) || 'فروشگاه مرکزی مغزدانه',
              };
            }),
            totals: {
              subtotal: liveT.subtotal,
              discount: liveT.discount,
              shipping: finalShip,
              totalKg: liveT.totalKg,
              grand: computedGrand,
            },
            status: (isWalletPay || paymentRefId) ? 'processing' : 'new',
          };

          let savedRemote = false;
          let finalGrand = computedGrand;
          try {
            const res = await apiFetch('/api/orders', {
              method: 'POST',
              body: JSON.stringify({
                orderCode: order.id,
                customer: order.customer,
                shipping: order.shipping,
                payment: order.payment,
                paymentMethod: order.paymentMethod,
                paymentRefId: order.paymentRefId,
                escrowProtected: true,
                corporateInvoice: order.corporateInvoice,
                couponCode: order.couponCode,
                note: order.note,
                items: order.items,
                totals: order.totals,
              }),
            });
            if (res && res.ok) {
              savedRemote = true;
              if (res.order && typeof res.order.grandTotal === 'number') finalGrand = res.order.grandTotal;
              if (APP.serverUser && typeof res.walletBalance === 'number') {
                APP.serverUser.walletBalance = res.walletBalance;
              }
            }
          } catch (err) {
            if (isWalletPay) {
              toast(err.message || 'خطا در پرداخت از کیف پول');
              btn.disabled = false;
              btn.textContent = 'ثبت نهایی سفارش';
              return;
            }
            console.error(err);
          }

          const local = JSON.parse(localStorage.getItem('maghzdaneh_orders') || '[]');
          local.push(order);
          localStorage.setItem('maghzdaneh_orders', JSON.stringify(local));

          try {
            if (window.MgzCloud && window.MgzCloud.getCurrentUser()) {
              await window.MgzCloud.createOrder({
                orderCode: order.id,
                customerName: order.customer.name,
                customerPhone: order.customer.phone,
                customerEmail: order.customer.email,
                province: order.customer.province,
                city: order.customer.city,
                address: order.customer.address,
                note: order.note,
                items: order.items,
                subtotal: liveT.subtotal,
                shippingCost: liveT.shipCost,
                grandTotal: finalGrand,
                totalKg: liveT.totalKg,
              });
              savedRemote = true;
            } else if (!savedRemote && window.GHDB) {
              savedRemote = await GHDB.submitOrder(order);
            }
          } catch (err) {
            console.error(err);
          }

          APP.cart = [];
          clearCoupon();
          saveCart();
          location.href = `success.html?order=${encodeURIComponent(order.id)}&total=${finalGrand}${savedRemote ? '' : '&local=1'}`;
        });

        const su = APP.serverUser;
        if (su) {
          if (su.fullName && !document.getElementById('f-name').value) document.getElementById('f-name').value = su.fullName;
          if (su.phone && !document.getElementById('f-phone').value) document.getElementById('f-phone').value = su.phone;
          if (su.email && !document.getElementById('f-email').value) document.getElementById('f-email').value = su.email;
          if (su.province && !document.getElementById('f-prov').value) document.getElementById('f-prov').value = su.province;
          if (su.city && !document.getElementById('f-city').value) document.getElementById('f-city').value = su.city;
          if (su.address && !document.getElementById('f-addr').value) document.getElementById('f-addr').value = su.address;
          if (su.postalCode && !document.getElementById('f-post').value) document.getElementById('f-post').value = su.postalCode;
        }
      }
      render();
      document.addEventListener('cart:changed', render);
      document.addEventListener('mgz:auth', render);
      if (window.MGZ) MGZ.init();
    });
  </script>
  <style>
    @media (max-width: 900px) { .co-layout { grid-template-columns: 1fr !important; } }
  </style>
</body>
</html>
