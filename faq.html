<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سوالات متداول | مغزدانه</title>
  <meta name="description" content="پاسخ سوال‌های رایج درباره خرید مغز پسته، بادام و گردو: قیمت‌ها، خرید عمده، ارسال، بسته‌بندی و مرجوعی.">
  <meta name="theme-color" content="#07100b">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/fx.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="page-head">
    <div class="container">
      <span class="sec-label">FAQ — راهنمای خریداران</span>
      <h1>سوالات متداول</h1>
      <p>پاسخ شفاف به پرتکرارترین پرسش‌ها درباره گرید مغزها، قیمت پلکانی، بسته‌بندی، ارسال و ضمانت مرجوعی.</p>
    </div>
  </div>

  <section>
    <div class="container" style="max-width:860px">
      <div class="field" style="margin-bottom:22px">
        <label for="faq-q">جستجو در سوالات</label>
        <input id="faq-q" type="search" placeholder="مثلاً ارسال رایگان، انس پسته، مرجوعی، فاکتور رسمی، نگهداری…">
      </div>

      <div id="faq-list" data-reveal-stagger></div>

      <div class="empty" style="margin-top:28px">
        <div class="big" id="faq-help-ico"></div>
        <p style="color:#fff;font-weight:800">پاسخ سوال‌تان را پیدا نکردید؟</p>
        <p style="font-size:var(--fs-sm);margin-top:6px">کارشناسان فروش خرده و عمده همه‌روزه پاسخگوی شما هستند.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
          <a class="btn btn-primary btn-sm" href="contact.html">تماس با مغزدانه</a>
          <a class="btn btn-outline btn-sm" href="wholesale.html">راهنمای خرید عمده</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script>
    boot('faq').then(async db => {
      document.getElementById('faq-help-ico').innerHTML = icon('phone');
      const listEl = document.getElementById('faq-list');
      const searchEl = document.getElementById('faq-q');

      let faqSource = db.faq || [];
      if (window.MgzCloud) {
        const pg = await window.MgzCloud.getSiteContent('pages').catch(() => null);
        if (pg && Array.isArray(pg.faqItems) && pg.faqItems.length) {
          faqSource = pg.faqItems;
        }
      }

      function renderFaq(query) {
        const q = (query || '').trim();
        const items = q
          ? faqSource.filter(f => (f.q + ' ' + f.a).includes(q))
          : faqSource;

        if (!items.length) {
          listEl.innerHTML = `<div class="empty"><p>سوالی با عبارت «${q}» پیدا نشد. عبارت دیگری امتحان کنید یا از صفحه تماس بپرسید.</p></div>`;
          return;
        }
        listEl.innerHTML = items.map((f, i) => `
          <details class="faq" ${i === 0 ? 'open' : ''}>
            <summary>${f.q}</summary>
            <div class="a">${f.a}</div>
          </details>`).join('');
        if (window.MGZ) MGZ.init();
      }

      renderFaq('');
      searchEl.addEventListener('input', () => renderFaq(searchEl.value));

      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'FAQPage',
        mainEntity: db.faq.map(f => ({
          '@type': 'Question',
          name: f.q,
          acceptedAnswer: { '@type': 'Answer', text: f.a }
        }))
      });
      document.head.appendChild(ld);
    });
  </script>
</body>
</html>
