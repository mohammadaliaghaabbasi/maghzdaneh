<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جزئیات محصول | مغزدانه</title>
  <meta name="description" content="مشخصات کامل، قیمت پلکانی و خرید عمده و خرده مغزها در مغزدانه.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <div class="container">
    <nav class="crumb" id="crumb" aria-label="مسیر صفحه"></nav>
    <div class="pd-grid" id="pd">
      <div class="pd-img"><img id="pd-img" src="" alt="" width="600" height="545"></div>
      <div class="pd-info" id="pd-info"></div>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="sec-head">
        <h2>محصولات مرتبط</h2>
      </div>
      <div class="grid" id="related"></div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/app.js"></script>
  <script>
    const pid = new URLSearchParams(location.search).get('id');

    boot('').then(db => {
      const p = byId(pid);
      if (!p) {
        document.getElementById('pd').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">🤷</div><p>این محصول پیدا نشد. <a href="catalog.html">به کاتالوگ برگردید</a>.</p></div>';
        return;
      }
      document.title = `${p.name} | مغزدانه — خرید با قیمت پلکانی`;
      document.querySelector('meta[name="description"]').setAttribute('content',
        `${p.desc} — قیمت از ${fmt(Math.min(...Object.values(p.prices)))} تومان، خرید خرده و عمده.`);

      document.getElementById('crumb').innerHTML =
        `<a href="index.html">مغزدانه</a> › <a href="catalog.html">کاتالوگ</a> › <a href="catalog.html?cat=${p.category}">${catName(p.category)}</a> › <b>${p.name}</b>`;

      document.getElementById('pd-img').src = p.img;
      document.getElementById('pd-img').alt = p.name;

      let selTier = APP.tier === 'retail' ? 'retail' : APP.tier;
      let qty = selTier === 'retail' ? 1 : selTier === 'semi' ? 5 : 25;

      function render() {
        const price = p.prices[selTier];
        const tierMeta = db.tiers.find(t => t.id === selTier);
        const retail = p.prices.retail;
        const save = selTier !== 'retail' ? Math.round((1 - price / retail) * 100) : 0;
        document.getElementById('pd-info').innerHTML = `
          <h1>${p.name}</h1>
          <div class="pd-meta">
            <span class="stars">${starsHtml(p.rating)} ${fmt(p.rating)}</span>
            <span>${fmt(p.sold)} فروش موفق</span>
            <span>مبدأ: ${p.origin}</span>
            <span>گرید: ${p.grade}</span>
          </div>
          <p class="pd-desc">${p.desc}</p>
          <ul class="spec-list">${p.specs.map(s => `<li>${s}</li>`).join('')}</ul>
          <p class="uses"><b>مناسب برای:</b> ${p.uses.join('، ')}</p>

          <h3 style="font-size:var(--fs-base);margin-bottom:8px">پله خرید را انتخاب کنید</h3>
          <div class="tier-select">
            ${db.tiers.map(t => `
              <label class="tier-opt ${selTier === t.id ? 'sel' : ''}">
                <input type="radio" name="tier" value="${t.id}" ${selTier === t.id ? 'checked' : ''}>
                <span><span class="t-name">${t.label}</span><br><span class="t-min">${t.desc}</span></span>
                <span class="t-price">${fmt(p.prices[t.id])} <small style="font-weight:600;color:var(--c-text-soft)">ت/کیلو</small></span>
              </label>`).join('')}
          </div>

          <div class="qty-row">
            <div class="qty-box">
              <button type="button" id="minus" aria-label="کاهش">−</button>
              <input type="number" id="qty" min="0.25" step="0.25" value="${qty}" aria-label="مقدار">
              <button type="button" id="plus" aria-label="افزایش">+</button>
            </div>
            <span class="qty-unit">کیلوگرم</span>
            <span class="pd-total" id="total"></span>
          </div>

          <div class="pd-cta">
            <button class="btn btn-primary" id="add-btn" style="flex:1">افزودن به سبد خرید</button>
            <a class="btn btn-outline" href="cart.html">مشاهده سبد</a>
          </div>
          <p class="stock-note">✓ ${p.stock > 0 ? `${fmt(p.stock)} کیلو آماده ارسال` : 'موجودی به اتمام رسیده — تماس بگیرید'}</p>
          ${save ? `<p class="stock-note" style="color:var(--c-accent)">با این پله ${fmt(save)}٪ نسبت به قیمت خرده‌فروشی صرفه‌جویی می‌کنید.</p>` : ''}
        `;

        const total = document.getElementById('total');
        const qEl = document.getElementById('qty');
        function updTotal() {
          const q = parseFloat(qEl.value) || 0;
          total.innerHTML = `${fmt(Math.round(q * p.prices[selTier]))} <small>تومان</small>`;
        }
        qEl.addEventListener('input', updTotal);
        document.getElementById('minus').onclick = () => { qEl.value = Math.max(0.25, (parseFloat(qEl.value) || 1) - 0.5); updTotal(); };
        document.getElementById('plus').onclick = () => { qEl.value = (parseFloat(qEl.value) || 0) + 0.5; updTotal(); };
        updTotal();

        document.querySelectorAll('input[name="tier"]').forEach(r => r.addEventListener('change', () => {
          selTier = r.value;
          qty = selTier === 'retail' ? 1 : selTier === 'semi' ? 5 : 25;
          render();
        }));

        document.getElementById('add-btn').onclick = () => {
          const q = parseFloat(qEl.value);
          if (!q || q <= 0) { toast('مقدار را وارد کنید'); return; }
          const min = db.tiers.find(t => t.id === selTier).min;
          if (q < min) { toast(`حداقل خرید پله «${tierLabel(selTier)}» ${fmt(min)} کیلو است`); return; }
          addToCart(p.id, q, selTier);
        };
      }
      render();

      // related
      const rel = db.products.filter(x => x.category === p.category && x.id !== p.id).slice(0, 4);
      const fill = rel.length < 4 ? db.products.filter(x => x.category !== p.category).slice(0, 4 - rel.length) : [];
      document.getElementById('related').innerHTML = [...rel, ...fill].map(productCard).join('');
      bindAddButtons();

      // JSON-LD product
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Product",
        "name": p.name,
        "image": p.img,
        "description": p.desc,
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": p.rating, "reviewCount": p.sold },
        "offers": {
          "@type": "Offer",
          "priceCurrency": "IRR",
          "price": p.prices.retail * 10,
          "availability": p.stock > 0 ? "https://schema.org/InStock" : "https://schema.org/OutOfStock"
        }
      });
      document.head.appendChild(ld);
    });
  </script>
</body>
</html>
